name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # So a broken build on a branch is caught before it reaches Pages.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push should win, but never interrupt a deploy that is already writing.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # ffmpeg-static's postinstall downloads a ~30 MB binary. Only `npm run audio`
  # needs it and the assets are committed, so point FFMPEG_BIN at any existing
  # file and the install step skips the download entirely.
  FFMPEG_BIN: /bin/true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # A project site lives at /<repo>/; a user or org site lives at the root.
      # Everything asset-shaped in the app is built from this prefix.
      - name: Work out the base path
        id: base
        run: |
          repo='${{ github.event.repository.name }}'
          owner='${{ github.repository_owner }}'
          if [ "$repo" = "$owner.github.io" ]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$repo/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
        run: npm run build

      # Opening fast is a product requirement, so a regression fails the build
      # rather than quietly shipping.
      - name: Check the bundle budget
        run: npm run size

      - name: Verify the build is base-correct
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
        run: node scripts/check-base.mjs "$BASE_PATH"

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
