name: Build, deploy and release

on:
  push:
    branches: [main]
    # Tags need listing explicitly. A workflow filtered only on `branches` does
    # not run for a tag push at all — pushing v0.1.0 would silently do nothing.
    tags: ['v*.*.*']
  # So a broken build on a branch is caught before it reaches Pages.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only the deploy job gets to write anywhere; see its own block below.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        env:
          # ffmpeg-static's postinstall downloads a ~30 MB binary. Only
          # `npm run audio` needs it and the assets are committed, so pointing
          # FFMPEG_BIN at any existing file skips the download entirely.
          FFMPEG_BIN: /bin/true

      # A project site lives at /<repo>/; a user or org site lives at the root.
      # Everything asset-shaped in the app is built from this prefix.
      - name: Work out the base path
        id: base
        run: |
          repo='${{ github.event.repository.name }}'
          owner='${{ github.repository_owner }}'
          if [ "$repo" = "$owner.github.io" ]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$repo/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
        run: npm run build

      # Opening fast is a product requirement, so a regression fails the build
      # rather than quietly shipping.
      - name: Check the bundle budget
        run: npm run size

      - name: Verify the build is base-correct
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
        run: npm run check-base

      # Skipped for tags too — nothing would consume it, since deploy only runs
      # for branch pushes.
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        with:
          path: dist

  # 80 checks in a real browser against a real build. Runs in parallel with the
  # build to keep the wall clock down, but the deploy waits for it — this is the
  # job that caught the service worker never caching the audio, which is exactly
  # the kind of thing that should never reach anyone's phone.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        env:
          FFMPEG_BIN: /bin/true

      # Cache the browser itself — it is ~130 MB and never changes between runs.
      - name: Work out the Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Built at the root here: the suite navigates to "/", and the base path only
      # matters for what actually gets published.
      - run: npm run build

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    needs: [build, e2e]
    # Branch pushes and manual runs only. A tag points at a commit that main has
    # already published, so deploying again would just repeat the same upload.
    if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # A newer push should win, but never interrupt a deploy that is already
    # writing. Scoped to this job so pull-request checks don't queue behind it.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Turns a pushed tag into an actual GitHub release. Gated on build and e2e, so a
  # tag that does not pass its own checks never becomes a release.
  release:
    needs: [build, e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        env:
          FFMPEG_BIN: /bin/true

      # The tag must match what package.json claims, or the release is mislabelled.
      - name: Check the tag against package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag does not match package.json version $pkg." >&2
            exit 1
          fi
          echo "Releasing $tag"

      # Fails the release if that version has no changelog entry, rather than
      # publishing one with empty notes.
      - name: Take the release notes from CHANGELOG.md
        run: node scripts/changelog-section.mjs "$GITHUB_REF_NAME" > release-notes.md

      # A self-hostable copy of the site. Built at the root, which is what you want
      # when serving it from your own domain rather than from /Later/.
      - name: Build a portable copy
        run: npm run build
        env:
          BASE_PATH: /

      # zip is present on the ubuntu runners, but falling back to tar costs three
      # lines and means a missing tool can never be the reason a release does not
      # appear.
      - name: Package it
        id: pkg
        run: |
          name="later-${GITHUB_REF_NAME}-static"
          if command -v zip >/dev/null 2>&1; then
            (cd dist && zip -qr "../$name.zip" .)
            echo "file=$name.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "$name.tar.gz" -C dist .
            echo "file=$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Later. $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            "${{ steps.pkg.outputs.file }}#Static site (serve from a domain root)"
